<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>Bibbles & Bubbles Birthday Tour</title>
<style>
    


body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    
    min-height: 100vh;
    margin: 0;
    padding: 16px;
    background: black;
    box-sizing: border-box;
}

.points {
    color: rgba(255, 255, 255, 0.5);
    position: absolute;
    top: -10px;
    font-size: 0.75rem;
    text-align: center;
}

.tour-image {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;

    position: relative;
}

.tour-image img {
    width: 70%;
    height: auto;
    display: block;
    margin: 0 auto;
    margin-top: 2rem;
    object-fit: cover;
}

.quiz {
    background: white;
    padding: 24px;
    border-radius: 60px 60px 0px 0px;
    width: 100vw;
    min-height: 80vh;
    max-width: none;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: absolute;
    top: 1.25rem;
  background: linear-gradient(to top, #ff5e62, #ff9966); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */


border-style: groove;
border-width: 1px;
border-color: rgba(0, 0, 0, 0.8);
box-shadow: rgba(255, 255, 255, 0.3) 0px 2px 20px -1px;

}

.quiz-message {
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    color: black;
    display: block;
    position: absolute;
    top: 10rem;
    left: 2rem;
    right: 2rem;
}

input, select, textarea{
    width: 100%;
    height: 65px;
    padding: 20px;
    bottom: 0px;
    left: 0;
    text-align: center;
    position: absolute;
    box-sizing: border-box;
    border: solid 1px rgba(255, 255, 255, 0.2);
    border-radius: 0px 0px 0px 0px;
    font-size: 1rem;
    font-weight: bold;
    background: white;
    color: rgba(0, 0, 0, 0.5);

    
}

input::placeholder {
    color: var(--placeholder-color);
}

.actions {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    position: absolute;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;
}

.next-button {
    background-color: white;
    color: black;

    border: none;
    border-radius: 0px 0px 25px 0px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    height: 4rem;
    width: calc(100% - 25% - 12px); /* Adjust width to account for hint button and gap */
    flex: 0 0 auto;
    font-size: 1rem;
    font-weight: bold;
    
}

.hint-button {
    background-color: rgba(255, 255, 255, 0.0);
    color: white;

    border: 1px solid white;
    border-radius: 0px 0px 0px 25px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    height: 4rem;
    width: 25%;
    flex: 0 0 auto;
    font-size: 1rem;
    font-weight: bold;
}

.landscape {
    visibility: hidden;
}

@media (min-width: 568px) {

html {
    overflow: hidden;
}

 .landscape {
    visibility: visible;
    position: absolute;
    display: block;
    height: 100vh;
    width: 100vw;
    background: black;
    z-index: 1000;
   
 }

 .landscape h1 {
position: relative;
  top: 30%;
  transform: translate(0, -50%);

    color: white;
    text-align: center;
 }

}

</style>
</head>


<body>
<div class="landscape">

    <h1>Please Rotate your Phone
<br>
<br>
I Love You

    </h1>
</div>

<p class="points">Total Points: 0</p>
<div class="quiz">
    <div class="tour-image">
    <img src="../img/bibbles-and-bubbles-tour.png" alt="Tour Image">
</div>
    <h2 class="quiz-message">Welcome to the Bibbles and Bubbles Birthday Tour!
        <br>
        <br>
        In order to proceed, you must answer a row of questions. Only the correct answer will allow you to continue.
        <br>
        <br>
        Do you want to proceed?
        <br>
        Type 'Yes' to continue.
        <br>
    </h2>


 

    <p id="message"></p>
        <input
        id="answer"
        type="text"
        placeholder="Your answer ..."
        autocomplete="off"
    >
</div>

   <div class="actions">
        <button class="hint-button" onclick="showHint()">Hint</button>
        <button class="next-button" onclick="checkAnswer()">Next</button>
    </div>

<script>
const correctAnswer = "yes";
const nextPage = "/secret-levels/index.html";

function checkAnswer() {
    const answer = document
        .getElementById("answer")
        .value
        .trim()
        .toLowerCase();

    if (answer === correctAnswer) {
        window.location.href = nextPage;
    } else {
        document.getElementById("answer").value = "";
        document.getElementById("answer").placeholder = "Bad Girl! Please try again.";
        answer.style.setProperty("--placeholder-color", "#ff5e62");
    }
}

function showHint() {
    document.getElementById("answer").value = "";
    document.getElementById("answer").placeholder = "It's a simple 'yes' or 'no' question.";
    answer.style.setProperty("--placeholder-color", "#ff5e62");

}

document.getElementById("answer").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        checkAnswer();
    }
});
</script>

</body>
</html>
