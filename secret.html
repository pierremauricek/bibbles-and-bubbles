<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>Quiz Question</title>
<style>

    
body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    min-height: 100vh;
    margin: 0;
    padding: 16px;
    background: black;
    box-sizing: border-box;
}

.tour-image {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
}

.tour-image img {
    width: 70%;
    height: auto;
    display: block;
    margin: 0 auto;
    object-fit: cover;
}

.quiz {
    background: white;
    padding: 24px;
    border-radius: 60px 60px 20px 20px;
    width: 100vw;
    min-height: 80vh;
    max-width: none;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: absolute;
    top: 1rem;
}

.quiz-message {
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    color: black;
    display: block;
    position: relative;
    top: 1rem;
}

input {
    width: 100%;
    height: 60px;
    padding: 20px;
    margin: 20px 0;
    box-sizing: border-box;
    position: relative;
    border-radius: 10px;
}

#message {
    text-align: center;
    
    text-justify: center;
    font-size: 1.2rem;
    font-weight: bold;
    color: red;
    display: block;
    position: absolute;
    bottom: 2rem;
   
    align-items: center;
    justify-content: center;
}

.actions {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    position: absolute;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    width: 90vw;
}

.next-button {
    background-color: white;
    color: black;

    border: none;
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    height: 4rem;
    width: calc(100% - 25% - 12px); /* Adjust width to account for hint button and gap */
    flex: 0 0 auto;
    font-size: 1rem;
    font-weight: bold;
    
}

.hint-button {
    background-color: rgba(255, 255, 255, 0.0);
    color: white;

    border: 1px solid white;
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    height: 4rem;
    width: 25%;
    flex: 0 0 auto;
    font-size: 1rem;
    font-weight: bold;
}


@media (min-width: 768px) {
    .quiz {
        width: 50vw;
        min-height: 20vh;
        max-width: none;
    }

    .actions {
    width: 50vw;
}

</style>
</head>


<body>



<div class="quiz">
    <div class="tour-image">
    <img src="../img/bibbles-and-bubbles-tour.png" alt="Tour Image">
</div>
    <h2 class="quiz-message">Welcome to the Bibbles and Bubbles Birthday Tour!
        <br>
        <br>
        In order to proceed, you must answer a row of questions. Only the correct answer will allow you to continue.
        <br>
        <br>
        Do you want to proceed?
        <br>
        Type 'Yes' to continue.
        <br>
    </h2>
    <input
        id="answer"
        type="text"
        placeholder="Your answer..."
        autocomplete="off"
    >

 

    <p id="message"></p>
</div>

   <div class="actions">
        <button class="hint-button" onclick="showHint()">Hint</button>
        <button class="next-button" onclick="checkAnswer()">Next</button>
    </div>

<script>
const correctAnswer = "yes";
const nextPage = "/secret-levels/index.html";

function checkAnswer() {
    const answer = document
        .getElementById("answer")
        .value
        .trim()
        .toLowerCase();

    if (answer === correctAnswer) {
        window.location.href = nextPage;
    } else {
        document.getElementById("message").textContent =
            "Bad Girl! Please try again.";
    }
}

function showHint() {
    document.getElementById("message").textContent =
        "It's a simple 'yes' or 'no' question.";
}

document.getElementById("answer").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        checkAnswer();
    }
});
</script>

</body>
</html>
